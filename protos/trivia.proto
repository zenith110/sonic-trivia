syntax = "proto3";

package protos;

option go_package = "sonic-trivia/backend/protos";
message Answer {
  string id = 1;
  string text = 2;
  bool is_correct = 3;
}

message AnswerOptions {
  repeated Answer answers = 1;
}

message Hint {
  string id = 1;
  string text = 2;
}
message Question {
  string id = 1;
  string text = 2;
  string category = 3;
  string difficulty = 4;
  AnswerOptions answer_options = 5;
  int64 points = 6;
  int64 rings = 7;
  repeated Hint hints = 8;
  string picture_for_question = 9;
  optional string picture_url = 10;
  string created_by = 11;
  bool is_under_review = 12;
}
message QuestionCollection {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_by = 4;
  repeated Question questions = 5;
  bool is_under_review = 6;
  bool is_public = 7;
}
service TriviaService {
  rpc GetQuestion(GetQuestionRequest) returns (GetQuestionResponse) {}
  rpc GetRandomQuestions(GetRandomQuestionsRequest) returns (GetRandomQuestionsResponse) {}
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse) {}
  rpc DeleteQuestion(DeleteQuestionRequest) returns (DeleteQuestionResponse) {}
  rpc CreateQuestion(CreateQuestionRequest) returns (CreateQuestionResponse) {}
  rpc GetAnsweredQuestions(GetAnsweredQuestionsRequest) returns (GetAnsweredQuestionsResponse) {}
  rpc CheckAnswer(CheckAnswerRequest) returns (CheckAnswerResponse) {}
  rpc CreateQuestionCollection(CreateQuestionCollectionRequest) returns (CreateQuestionCollectionResponse) {}
  rpc DeleteQuestionCollection(DeleteQuestionCollectionRequest) returns (DeleteQuestionCollectionResponse) {}
  rpc UpdateQuestionCollection(UpdateQuestionCollectionRequest) returns (UpdateQuestionCollectionResponse) {}
  rpc GetQuestionCollections(GetQuestionCollectionsRequest) returns (GetQuestionCollectionsResponse) {}
  rpc GetQuestions(GetQuestionsRequest) returns (GetQuestionsResponse) {}
}
message GetQuestionsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message GetQuestionsResponse {
  repeated Question questions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

message GetQuestionCollectionsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetQuestionCollectionsResponse {
  repeated QuestionCollection collections = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateQuestionCollectionRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Question questions = 4;
}

message UpdateQuestionCollectionResponse {
  bool is_success = 1;
}

message DeleteQuestionCollectionRequest {
  string id = 1;
}

message DeleteQuestionCollectionResponse {
  bool is_success = 1;
}

message CreateQuestionCollectionRequest {
  string name = 1;
  string description = 2;
  string created_by = 3;
  string size_of_collection = 4;
  repeated string question_ids = 5;
}

message CreateQuestionCollectionResponse {
  string id = 1;
}

message GetRandomQuestionsRequest {
  string category = 1;
  int32 how_many_rounds = 2;
  string difficulty = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message GetRandomQuestionsResponse {
  repeated Question questions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

message CheckAnswerRequest {
  string question_id = 1;
  string answer_id = 2;
}

message CheckAnswerResponse {
  bool is_correct = 1;
}

message UpdateQuestionRequest {
  string id = 1;
  string text = 2;
  string category = 3;
  string difficulty = 4;
  AnswerOptions answer_options = 5;
  int64 points = 6;
  repeated Hint hints = 7;
  optional bytes picture_file = 8;
  optional string collection_id = 9;
}

message UpdateQuestionResponse {
  Question question = 1;
}

message DeleteQuestionRequest {
  string id = 1;
}

message DeleteQuestionResponse {
  bool success = 1;
}

message CreateQuestionRequest {
  Question question = 1;
  optional string collection_id = 2;
}

message CreateQuestionResponse {
  Question question = 1;
}

message GetAnsweredQuestionsRequest {
  string user_id = 1;
}

message GetAnsweredQuestionsResponse {
  repeated Question questions = 1;
}

message GetRandomQuestionRequest {}

message GetQuestionRequest {
  string id = 1;
}

message GetQuestionResponse {
  Question question = 1;
}
