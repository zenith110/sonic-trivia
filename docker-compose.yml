version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sonic-trivia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonic_trivia
      POSTGRES_PASSWORD: sonic_trivia_pass
      POSTGRES_DB: sonic_trivia
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic_trivia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonic-trivia-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonic-trivia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Environment Configuration
      ENVIRONMENT: development

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sonic_trivia
      DB_PASSWORD: sonic_trivia_pass
      DB_NAME: sonic_trivia
      DB_SSLMODE: disable

      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-in-production

      # Server Configuration
      GRPC_PORT: 8080

      # CORS Configuration
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

      # Cloudflare R2 Storage (Optional - uncomment and fill in if using)
      # R2_ACCOUNT_ID: your-account-id
      # R2_ACCESS_KEY_ID: your-access-key
      # R2_SECRET_ACCESS_KEY: your-secret-key
      # R2_BUCKET_NAME: sonic-trivia-assets
    ports:
      - "8080:8080"
    networks:
      - sonic-trivia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  sonic-trivia-network:
    driver: bridge
