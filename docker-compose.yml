services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sonic-trivia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonic_trivia
      POSTGRES_PASSWORD: sonic_trivia_pass
      POSTGRES_DB: sonic_trivia
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic_trivia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonic-trivia-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonic-trivia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - sonic-trivia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  sonic-trivia-network:
    driver: bridge
